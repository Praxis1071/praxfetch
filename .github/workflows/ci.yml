name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pinned master commit; input below selects stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile check
        run: cargo check --all-targets

      - name: Tests
        run: cargo test --all-targets

      - name: Shell script syntax
        run: bash -n scripts/*.sh

      - name: Runtime invariant audit
        run: bash scripts/check-runtime-invariants.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release

  arch-linux:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch build tools and action runtime
        run: pacman -Syu --noconfirm --needed ca-certificates git nodejs rust

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Compile check
        run: cargo check --all-targets

      - name: Tests
        run: cargo test --all-targets

      - name: Shell script syntax
        run: bash -n scripts/*.sh

      - name: Runtime invariant audit
        run: bash scripts/check-runtime-invariants.sh

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Release build
        run: cargo build --release
